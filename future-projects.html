<!DOCTYPE html>
<html lang="en">
    <head>

        <link rel="stylesheet" href="css.css">

    <body>

        <!-- header loader -->
        <!-- loads the header into the page from header.js -->
        <div id="header_con"></div>
        <script src="header.js"></script>

        <!-- main stuff of the page -->
        <main>

            <!-- main content of the page -->
            <div class="main_content">

                <!-- future projects section -->
                <section id="mfp">
                    <!-- page header -->
                    <h1>
                        MY FUTURE PROJECTS
                    </h1>

                    <!-- content -->
                    <p>
                        Here are some of my future projects that I'm doing
                    </p>

                </section>
                

                <!-- Macropad section -->
                <div class="flex projects">

                    <section>
                        <img src="images/macropad.png" class="project_img" alt="stuff">
                    </section>

                    <section>
                        <!-- header of section -->
                        <h2 class="project_h2_red">
                            Macropad
                        </h2>

                        <!-- content -->
                        <p>
                            A year 12 electronics project

                            macropad is like a extra 
                            keyboard with extra keys

                            don't have to remember them
                        </p>
                    </section>

                </div>

                <!-- SECRET GAME section -->
                <div class="flex projects">
                    
                    <section>
                        <!-- header of section -->
                        <h2 class="project_h2_green">
                            SECRET GAME
                        </h2>

                        <!-- content -->
                        <p>
                            Secret 
                            personal game
                        </p>
                    </section>

                    <!-- question mark image -->
                    <section>
                        <div id="secret">
                            <p>?</p>
                        </div>
                    </section>
                </div>
                
            </div>

        <!-- footer loader -->
        <!-- loads the footer into the page from footer.js -->
        <div id="footer_con"></div>
        <script src="footer.js"></script>
